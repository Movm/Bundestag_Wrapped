name: Refresh Bundestag Wrapped data

# Regenerates the pre-computed Bundestag-Wrapped datasets (apps/wrapped/public/*.json)
# from the public MCP server. Refreshed data is merged through a pull request because
# main is protected by required status checks. bundestag-wrapped (Coolify, GitHub-App
# connected to main) auto-deploys after the pull request is merged.
#
# Runs weekly, and on demand via "Run workflow".

on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      wahlperiode:
        description: 'Wahlperiode to analyze'
        default: '21'
        required: false

# The existing PAT is used below instead of GITHUB_TOKEN so that pushes to the
# refresh branch trigger the pull_request workflows required by branch protection.
permissions:
  contents: read

concurrency:
  group: wrapped-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Verify refresh token
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::GHCR_PAT must have repository contents and pull-request write access."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHCR_PAT }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis package + spaCy model
        run: |
          python -m pip install --upgrade pip
          pip install -e services/analysis
          pip install "https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl"

      - name: Regenerate datasets from the public MCP
        working-directory: services/analysis
        env:
          WP: ${{ github.event.inputs.wahlperiode || '21' }}
          MCP_SERVER: https://mcp.bundestag-wrapped.de
        run: |
          set -euo pipefail
          bundestag-analysis --server "$MCP_SERVER" download ./data -w "$WP"
          bundestag-analysis parse ./data
          bundestag-analysis analyze ./data -w "$WP" -o ./results -q
          bundestag-analysis export-all ./data -r ./results -o "$GITHUB_WORKSPACE/apps/wrapped/public"

      - name: Publish refreshed datasets through a protected pull request
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail

          git config user.name "wrapped-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/wrapped/public
          if git diff --cached --quiet; then
            echo "No data changes — nothing to publish."
            exit 0
          fi

          SITZUNGEN=$(python -c "import json;print(json.load(open('apps/wrapped/public/wrapped.json'))['metadata']['sitzungen'])")
          CURRENT_SITZUNGEN=$(git show HEAD:apps/wrapped/public/wrapped.json | python -c "import json,sys;print(json.load(sys.stdin)['metadata']['sitzungen'])")
          if (( SITZUNGEN < CURRENT_SITZUNGEN )); then
            echo "::error::Refusing to publish a data regression from Sitzung ${CURRENT_SITZUNGEN} to ${SITZUNGEN}."
            exit 1
          fi

          BRANCH="automation/wrapped-data-refresh"
          COMMIT_MESSAGE="chore(data): refresh Bundestag Wrapped datasets (Sitzung ${SITZUNGEN})"
          PR_TITLE="$COMMIT_MESSAGE"
          PR_BODY="Automated weekly refresh of the pre-computed Bundestag Wrapped datasets through Sitzung ${SITZUNGEN}."

          git switch -C "$BRANCH"
          git commit -m "$COMMIT_MESSAGE"

          REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')
          if [[ -n "$REMOTE_SHA" ]]; then
            git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          PR_URL=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json url \
            --jq '.[0].url')

          if [[ -z "$PR_URL" ]]; then
            PR_URL=$(gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "$PR_TITLE" \
              --body "$PR_BODY")
          else
            gh pr edit "$PR_URL" --title "$PR_TITLE" --body "$PR_BODY"
          fi

          CHECK_COUNT=0
          for _ in {1..12}; do
            CHECK_COUNT=$(gh pr checks "$PR_URL" --required --json name --jq 'length' 2>/dev/null || true)
            if (( ${CHECK_COUNT:-0} > 0 )); then
              break
            fi
            sleep 5
          done

          if (( ${CHECK_COUNT:-0} == 0 )); then
            echo "::error::No required checks were registered for $PR_URL."
            exit 1
          fi

          gh pr checks "$PR_URL" --required --watch --interval 15
          gh pr merge "$PR_URL" --squash --delete-branch
