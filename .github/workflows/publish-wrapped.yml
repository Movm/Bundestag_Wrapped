name: Publish Wrapped image

# Builds the Wrapped web image in Actions (with layer cache) and pushes it to
# GHCR, so the deploy host only pulls and swaps instead of building.
# Several merges in a row: the concurrency group cancels superseded runs, so
# only the newest commit is built and deployed.
#
# Coolify side (one-time): the existing git app cannot become a "Docker Image"
# app, so it keeps the Dockerfile build pack with Dockerfile Location
# /apps/wrapped/Dockerfile.deploy (a single FROM of this image) and git
# auto-deploy off; PREVIEW_ACCESS_CODE stays a runtime variable. Then add the secret COOLIFY_API_TOKEN and the variables
# COOLIFY_WRAPPED_APP_UUID (+ COOLIFY_URL if not app.coolify.io) so this
# workflow triggers the redeploy. Umami needs the repository variables
# VITE_UMAMI_URL and VITE_UMAMI_WEBSITE_ID (build-time, baked into the bundle).

on:
  push:
    branches: [main]
    paths:
      - 'apps/wrapped/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'scripts/write-build-info.mjs'
      - '.github/workflows/publish-wrapped.yml'
  workflow_dispatch:

concurrency:
  group: publish-wrapped
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # GHCR needs lowercase; github.repository_owner is "Movm".
  IMAGE: ghcr.io/movm/bundestag-wrapped

jobs:
  build-push-deploy:
    name: Build, push and deploy apps/wrapped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Movm is a user account: GITHUB_TOKEN may not create a package there
      # (measured: "denied: permission_denied: write_package"). GHCR_PAT is a
      # classic PAT of Movm with write:packages, shared with publish-mcp.yml.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,format=long

      # Same Dockerfile and cache scope as the CI build (ci.yml, matrix "wrapped"),
      # so layers the PR build already produced are reused here.
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/wrapped/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            VITE_UMAMI_URL=${{ vars.VITE_UMAMI_URL }}
            VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}
          cache-from: type=gha,scope=wrapped
          cache-to: type=gha,mode=max,scope=wrapped
          provenance: false

      # Skips cleanly until the Coolify secret and app UUID are configured.
      - name: Trigger Coolify redeploy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID: ${{ vars.COOLIFY_WRAPPED_APP_UUID }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL || 'https://app.coolify.io' }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$APP_UUID" ]; then
            echo "COOLIFY_API_TOKEN or COOLIFY_WRAPPED_APP_UUID not set: image pushed, skipping redeploy."
            exit 0
          fi
          curl -fsS "${COOLIFY_URL}/api/v1/deploy?uuid=${APP_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}"
