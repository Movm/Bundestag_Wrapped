server {
    # Non-root nginx (nginx-unprivileged) cannot bind :80.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/png;

    # App assets have hashed file names and may be cached forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The registry and manifests are control documents. They must be revalidated
    # so a published edition or rollback becomes visible without a hard refresh.
    location = /data/editions.json {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/data/[^/]+/[^/]+/manifest\.json$ {
        add_header Cache-Control "no-cache";
    }

    # Only data URLs which include both edition and data version are immutable.
    location ~ ^/data/[^/]+/[^/]+/.+\.(json|mp3|ogg|wav)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
