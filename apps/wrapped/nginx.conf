# Preview gate. The entrypoint writes this map from PREVIEW_ACCESS_CODE:
#   map $cookie_gartenzaun $preview_unlocked { default 0; "<code>" 1; }
# Deliberately a garden fence, not a vault: the code travels as a plain cookie
# set by /zugang/. It keeps the unpublished edition away from casual visitors
# and search engines, nothing more.
include /tmp/preview-access.conf;

server {
    # Non-root nginx (nginx-unprivileged) cannot bind :80.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers: behind the proxy the internal port 8080 must not leak.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/png;

    # The unpublished edition is deliberately absent from navigation and is
    # guarded at the server boundary. Protect both the SPA routes and raw data.
    # Pages without the cookie go to the password page; data answers 401,
    # which the app also turns into a redirect to /zugang/.
    location = /2026 {
        if ($preview_unlocked = 0) { return 302 /zugang/?next=$request_uri; }
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /2026/ {
        if ($preview_unlocked = 0) { return 302 /zugang/?next=$request_uri; }
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /data/2026/ {
        if ($preview_unlocked = 0) { return 401; }
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }

    location = /zugang { return 301 /zugang/$is_args$args; }

    location ^~ /zugang/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /zugang/index.html;
    }

    # Preview reads use exact UTF-16 byte offsets; never compress this range source.
    location ~ "^/data/[^/]+/search-v[0-9]+-[a-f0-9]{64}-[a-f0-9]{64}/texts\.bin$" {
        # CORS for the native app shell (origin null / file://). No credentials.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            expires off;
            return 204;
        }
        gzip off;
        gzip_static off;
        max_ranges 50;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sidecars bind both the immutable manifest and original corpus checksums.
    # The protected /data/2026/ prefix above takes precedence over these regexes.
    location ~ "^/data/[^/]+/search-v[0-9]+-[a-f0-9]{64}-[a-f0-9]{64}/" {
        # CORS for the native app shell (origin null / file://). No credentials.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            expires off;
            return 204;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fonts and the share-image logo: same caching as the asset regex below,
    # which they would otherwise fall into, plus CORS.
    location ^~ /fonts/ {
        # CORS for the native app shell (origin null / file://): font loads and
        # canvas images (crossOrigin) need it. No credentials.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            expires off;
            return 204;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /logo.png {
        # CORS for the native app shell (origin null / file://): font loads and
        # canvas images (crossOrigin) need it. No credentials.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            expires off;
            return 204;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # App assets have hashed file names and may be cached forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The registry and manifests are control documents. They must be revalidated
    # so a published edition or rollback becomes visible without a hard refresh.
    location = /data/editions.json {
        # CORS for the native app shell (origin null / file://). No credentials.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            expires off;
            return 204;
        }
        add_header Cache-Control "no-cache";
    }

    location ~ ^/data/[^/]+/[^/]+/manifest\.json$ {
        # CORS for the native app shell (origin null / file://). No credentials.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            expires off;
            return 204;
        }
        add_header Cache-Control "no-cache";
    }

    # Only data URLs which include both edition and data version are immutable.
    location ~ ^/data/[^/]+/[^/]+/.+\.(json|mp3|ogg|wav)$ {
        # CORS for the native app shell (origin null / file://). No credentials.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            expires off;
            return 204;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # App audio. Own add_header here drops the server-level ones, so the
    # security headers are repeated below.
    location ^~ /sounds/ {
        # CORS for the native app shell (origin null / file://). No credentials.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            expires off;
            return 204;
        }
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
