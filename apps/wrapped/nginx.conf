server {
    # Non-root nginx (nginx-unprivileged) cannot bind :80.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/png;

    # The unpublished edition is deliberately absent from navigation and is
    # guarded at the server boundary. Protect both the SPA routes and raw data.
    location = /2026 {
        auth_basic "Bundestag Wrapped 2026 Vorschau";
        auth_basic_user_file /tmp/preview.htpasswd;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /2026/ {
        auth_basic "Bundestag Wrapped 2026 Vorschau";
        auth_basic_user_file /tmp/preview.htpasswd;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /data/2026/ {
        auth_basic "Bundestag Wrapped 2026 Vorschau";
        auth_basic_user_file /tmp/preview.htpasswd;
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }

    # Preview reads use exact UTF-16 byte offsets; never compress this range source.
    location ~ "^/data/[^/]+/search-v[0-9]+-[a-f0-9]{64}-[a-f0-9]{64}/texts\.bin$" {
        gzip off;
        gzip_static off;
        max_ranges 50;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sidecars bind both the immutable manifest and original corpus checksums.
    # The protected /data/2026/ prefix above takes precedence over these regexes.
    location ~ "^/data/[^/]+/search-v[0-9]+-[a-f0-9]{64}-[a-f0-9]{64}/" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # App assets have hashed file names and may be cached forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The registry and manifests are control documents. They must be revalidated
    # so a published edition or rollback becomes visible without a hard refresh.
    location = /data/editions.json {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/data/[^/]+/[^/]+/manifest\.json$ {
        add_header Cache-Control "no-cache";
    }

    # Only data URLs which include both edition and data version are immutable.
    location ~ ^/data/[^/]+/[^/]+/.+\.(json|mp3|ogg|wav)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
