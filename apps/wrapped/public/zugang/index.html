<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e0a14">
<title>Vorschau 2026 · Bundestag Wrapped</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!--
  Hallo, Quelltext-Leser*in! 🌱

  Ja, wir wissen es: Das hier ist ein Gartenzaun, kein Tresor.
  Das Passwort landet im Klartext in einem Cookie, das ehrlicherweise auch
  noch „gartenzaun“ heißt. Der Zaun soll Spaziergänger*innen vom frischen
  Rasen fernhalten, bis 2026 fertig ist – nicht Leute wie dich.

  Wer bis hierher gelesen hat, darf sich ein bisschen wie im Ältestenrat
  fühlen. Bitte nicht weitersagen; bald ist ohnehin alles öffentlich.
-->
<style>
  @font-face { font-family: 'Archivo'; src: url('/fonts/Archivo-latin.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; src: url('/fonts/JetBrainsMono-latin.woff2') format('woff2'); font-weight: 100 800; font-display: swap; }
  :root {
    --ink: #0e0a14; --card: #1c1030; --violet: #7b3ff2; --pink: #ff4fa0; --lilac: #b98cff; --mint: #46d17a;
    --wide: 'Archivo', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: #fff; }
  body {
    position: relative; overflow-x: clip; min-height: 100dvh; font-family: var(--wide);
    display: grid; place-items: center;
    padding: max(2rem, env(safe-area-inset-top, 0px)) max(1.25rem, env(safe-area-inset-right, 0px)) max(2rem, env(safe-area-inset-bottom, 0px)) max(1.25rem, env(safe-area-inset-left, 0px));
  }
  .logo { position: fixed; z-index: 2; top: max(1rem, env(safe-area-inset-top, 0px)); left: max(1rem, env(safe-area-inset-left, 0px)); display: block; }
  .logo img { display: block; height: 2rem; width: auto; }
  .orb { position: fixed; width: min(80vw, 46rem); aspect-ratio: 1; border-radius: 50%; background: #2a1450; top: -22%; right: -18%; }
  .block { position: fixed; width: min(30vw, 16rem); aspect-ratio: 1; background: var(--violet); bottom: -6rem; left: -4rem; transform: rotate(18deg); }
  main { position: relative; width: min(100%, 34rem); display: flex; flex-direction: column; gap: 1.75rem; }
  .eyebrow { align-self: flex-start; font-family: var(--mono); font-weight: 700; font-size: .8125rem; letter-spacing: .1em; text-transform: uppercase; background: #fff; color: var(--ink); padding: .45em .9em; border-radius: 999px; }
  h1 { margin: 0; font-weight: 900; font-stretch: 125%; text-transform: uppercase; font-size: clamp(3.25rem, 15vw, 7rem); line-height: .84; letter-spacing: -.05em; }
  h1 span { display: block; color: var(--pink); }
  p { margin: 0; font-size: 1.125rem; line-height: 1.45; color: #e6def2; max-width: 30rem; }
  form { display: flex; flex-direction: column; gap: .875rem; padding: 1.5rem; border-radius: 2rem; background: var(--card); }
  label { font-family: var(--mono); font-weight: 700; font-size: .8125rem; letter-spacing: .1em; text-transform: uppercase; color: #cbbde3; }
  .row { display: flex; flex-wrap: wrap; gap: .625rem; }
  input {
    flex: 1 1 12rem; min-width: 0; min-height: 3.5rem; padding: 0 1.25rem; border-radius: 999px; border: 2px solid #4a3a66;
    background: var(--ink); color: #fff; font: 800 1.25rem var(--wide); /* 16px+ keeps iOS from zooming */
  }
  input:focus-visible { outline: 3px solid #fff; outline-offset: 3px; border-color: var(--pink); }
  button {
    flex: 0 0 auto; min-height: 3.5rem; padding: 0 1.75rem; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--pink); color: var(--ink); font: 900 1.125rem var(--wide);
  }
  button:hover { background: #fff; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .error { min-height: 1.5rem; font-weight: 800; color: var(--pink); }
  .hint { font-size: .875rem; color: #a99bc4; }
  a { color: #fff; }
  @media (prefers-reduced-motion: no-preference) {
    main > * { animation: rise .7s cubic-bezier(.2, 1.3, .4, 1) backwards; }
    main > :nth-child(2) { animation-delay: .08s; } main > :nth-child(3) { animation-delay: .16s; } main > :nth-child(4) { animation-delay: .24s; }
    @keyframes rise { from { opacity: 0; transform: translateY(32px); } }
  }
</style>
</head>
<body>
<a class="logo" href="/"><img src="/logo.png" alt="Bundestag Wrapped – zur Startseite"></a>
<div class="orb" aria-hidden="true"></div>
<div class="block" aria-hidden="true"></div>
<main>
  <span class="eyebrow">Vorschau</span>
  <h1>Wrapped <span>2026</span></h1>
  <p>Die neue Ausgabe ist noch nicht öffentlich. Mit dem Passwort kommst du schon jetzt rein.</p>
  <form id="gate" novalidate>
    <label for="code">Passwort</label>
    <div class="row">
      <input id="code" name="code" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required aria-describedby="error">
      <button type="submit">Reinlassen</button>
    </div>
    <div id="error" class="error" role="alert"></div>
    <span class="hint">Groß- und Kleinschreibung ist egal. Zur Startseite geht es <a href="/">hier entlang</a>.</span>
  </form>
</main>
<script>
  // Garden fence, not a vault: the code sits in a plain cookie that nginx
  // compares against PREVIEW_ACCESS_CODE (see docker-entrypoint.d/40-preview-access.sh).
  console.log(
    '%c🌱 Gartenzaun, kein Tresor.%c\nJa, das Passwort steht gleich im Cookie „gartenzaun“. Wir wissen das.\nWer das hier liest, darf 2026 gern schon anschauen – nur bitte nicht weitersagen.',
    'font: 900 18px Archivo, sans-serif; color: #ff4fa0', 'font: 14px sans-serif'
  );
  (function () {
    var COOKIE = 'gartenzaun';
    var params = new URLSearchParams(location.search);
    // `next` is the rest of the query string: nginx passes $request_uri unencoded.
    var match = location.search.match(/[?&]next=(.*)$/);
    // Resolve the target the way the browser will and keep only same-origin
    // paths: a string check alone lets "/\t/evil.example" through, because
    // browsers strip tabs and newlines and read it as "//evil.example".
    var next = '/2026';
    try {
      var target = new URL(match ? decodeURIComponent(match[1]) : next, location.origin);
      if (target.origin === location.origin) next = target.pathname + target.search + target.hash;
    } catch (e) { /* malformed: keep the default */ }
    var input = document.getElementById('code');
    var error = document.getElementById('error');

    function normalize(value) { return value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, ''); }
    function unlock(code) {
      document.cookie = COOKIE + '=' + code + '; Path=/; Max-Age=' + 60 * 60 * 24 * 30 + '; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
      location.replace(next);
    }
    // A cookie that is still here means nginx sent us back: the code was wrong.
    if (document.cookie.split('; ').some(function (c) { return c.indexOf(COOKIE + '=') === 0; })) {
      document.cookie = COOKIE + '=; Path=/; Max-Age=0';
      if (!params.get('code')) error.textContent = 'Das Passwort stimmt nicht. Versuch es nochmal.';
    }
    // Share link: /zugang/?code=… unlocks without typing.
    if (params.get('code')) { unlock(normalize(params.get('code'))); return; }

    document.getElementById('gate').addEventListener('submit', function (event) {
      event.preventDefault();
      var code = normalize(input.value);
      if (!code) { error.textContent = 'Bitte gib das Passwort ein.'; input.focus(); return; }
      unlock(code);
    });
    input.focus();
  })();
</script>
</body>
</html>
