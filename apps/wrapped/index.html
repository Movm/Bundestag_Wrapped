<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BT Wrapped" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fallback SEO (overridden by react-helmet-async) -->
    <title>Bundestag Wrapped – Deine Bundestagsstatistiken</title>
    <meta name="description" content="Entdecke die Sprache des Bundestags mit interaktiven, editionsbasierten Statistiken." />

    <!-- Open Graph Fallbacks -->
    <meta property="og:title" content="Bundestag Wrapped – Deine Bundestagsstatistiken" />
    <meta property="og:description" content="Entdecke die Sprache des Bundestags mit interaktiven, editionsbasierten Statistiken." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="Bundestag Wrapped" />
    <meta property="og:image" content="https://bundestag-wrapped.de/og-image.png" />
    <meta property="og:url" content="https://bundestag-wrapped.de" />

    <!-- Twitter Card Fallbacks -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bundestag Wrapped – Deine Bundestagsstatistiken" />
    <meta name="twitter:description" content="Entdecke die Sprache des Bundestags mit interaktiven, editionsbasierten Statistiken." />
    <meta name="twitter:image" content="https://bundestag-wrapped.de/og-image.png" />

    <!-- Preload critical fonts (GDPR-compliant local fonts) -->
    <link rel="preload" href="/fonts/Roboto-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/NotoSans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preload critical assets -->
    <link rel="preload" href="/logo.png" as="image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
