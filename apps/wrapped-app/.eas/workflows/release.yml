# Store release: build iOS + Android (production profile) and hand both to the stores.
#
#   track      Android (eas.json submit profile)     iOS
#   closed     Play closed testing "alpha"            TestFlight external group (Beta App Review)
#   internal   Play internal testing                  TestFlight, internal testers only
#   open       Play open testing "beta"               TestFlight external group (Beta App Review)
#
# Start: tag `app-v1.2.0` (= closed), "Run" on expo.dev, or
#   npx eas-cli@latest workflow:run .eas/workflows/release.yml
# Every run is two store builds. Bump expo.version in app.json first; build numbers are remote.
# The production App Store / Play release itself stays a manual click in the consoles.
name: Store release

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      track:
        type: choice
        description: Where the builds go
        options: [closed, internal, open]
        default: closed
      testflight_group:
        type: string
        description: TestFlight external group (closed/open only)
        default: Testgruppe
      changelog:
        type: string
        description: What to test
        default: ''

concurrency:
  cancel_in_progress: false
  group: store-release

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  testflight_external:
    name: TestFlight (external)
    needs: [build_ios]
    if: ${{ inputs.track != 'internal' }}
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      external_groups: ['${{ inputs.testflight_group || ''Testgruppe'' }}']
      changelog: ${{ inputs.changelog }}

  testflight_internal:
    name: TestFlight (internal)
    needs: [build_ios]
    if: ${{ inputs.track == 'internal' }}
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      changelog: ${{ inputs.changelog }}

  play:
    name: Google Play
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: ${{ inputs.track == 'internal' && 'internal' || (inputs.track == 'open' && 'open-testing' || 'production') }}
