# Store release: build iOS + Android (production profile), then
# iOS → TestFlight (external group, goes to Beta App Review) and
# Android → Play closed testing track "alpha" (submit profile in eas.json).
#
# Start it: push a tag `app-v1.1.0`, run it on expo.dev, or
#   npx eas-cli@latest workflow:run .eas/workflows/release.yml
# Needs the GitHub repo connected on expo.dev with base directory apps/wrapped-app.
name: Store release

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      testflight_group:
        description: TestFlight external group
        type: string
        default: Beta
      changelog:
        description: What to test
        type: string
        default: ''

concurrency:
  cancel_in_progress: false
  group: store-release

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  testflight:
    name: TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      external_groups: ['${{ inputs.testflight_group || ''Beta'' }}']
      changelog: ${{ inputs.changelog }}

  play_alpha:
    name: Play closed testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
